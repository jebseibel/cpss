server:
  port: ${PORT:8080}

spring:
  application:
    name: cpss
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  main:
    allow-bean-definition-overriding: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

app:
  email:
    from: ${MAIL_FROM:noreply@cpss.com}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

security:
  login:
    # /api/auth/login must stay public - a browser cannot carry a JWT before it has one - so it
    # is the only unauthenticated door into the app. Unthrottled, an attacker guesses passwords
    # as fast as the network allows.
    #
    # Counts CONSECUTIVE FAILURES per IP+username; a successful login clears the counter, so
    # mistyping a password twice and then getting it right never locks anyone out.
    #
    # 8 sits well above human error and far below useful guessing: someone who has genuinely
    # forgotten a password tries three or four variations, an attacker needs thousands.
    max-attempts: ${LOGIN_MAX_ATTEMPTS:8}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

logging:
  level:
    com.seibel.cpss.loader.DataLoader: INFO
    org.springframework.security.config.annotation.authentication.configuration: ERROR